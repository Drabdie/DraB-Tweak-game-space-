name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          $ANDROID_SDK_ROOT/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='com.drabdie.tweak'"
          $ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner verify app/build/outputs/apk/debug/app-debug.apk
          echo "APK verification: PASS"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraB-Tweak-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
