plugins { id 'com.android.application' }

android {
    namespace 'com.drabdie.tweak'
    compileSdk 35
    buildFeatures { aidl true }
    defaultConfig {
        applicationId 'com.drabdie.tweak'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '3.0.0'
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
